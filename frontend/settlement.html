<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공동 정산 | 같이 주문하기</title>
    <link rel="stylesheet" href="css/order-pages.css">
    <script src="js/order-pages.js" defer></script>
</head>
<body class="order-page" data-page="settlement">
    <header class="header">
        <h1 class="logo">
            <a href="index.html">LOGO</a>
        </h1>

        <nav aria-label="주 메뉴">
            <a href="index.html">홈</a>
            <a href="index.html#delivery-page">모집글 찾기</a>
            <a class="account-link" href="mypage.html">내 계정</a>
        </nav>
    </header>

    <main class="container">
        <a class="order-back-link" id="backToChat" href="index.html">‹ 채팅방으로</a>
        <div id="settlementRoot" aria-live="polite"></div>
    </main>

    <div id="toast" class="order-toast" role="status" aria-live="polite" hidden></div>

    <div id="settlementModal" class="order-modal-backdrop" hidden>
        <section class="order-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="order-modal-header">
                <h2 id="modalTitle">정산 안내</h2>
                <button type="button" id="closeModal" class="order-icon-button" aria-label="닫기">✕</button>
            </div>
            <p>아래 내용을 참여자에게 전달할 수 있습니다. 실제 송금 기능은 연결되어 있지 않습니다.</p>
            <div id="settlementMessage" class="order-copy-text"></div>
            <div class="order-button-row">
                <button type="button" class="order-button order-button-outline" id="cancelModal">닫기</button>
                <button type="button" class="order-button order-button-primary" id="copyMessage">안내 문구 복사</button>
            </div>
        </section>
    </div>
</body>
</html>
