
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | 같이 주문하기</title>
    <link rel="stylesheet" href="css/login.css">
    <script src="js/auth.js" defer></script>
    <script src="js/login.js" defer></script>
</head>
<body>
    <div class="login-container">
        <header>
            <h1>LOGO</h1>
            <p>함께 주문하고 함께 절약해요!</p>
        </header>

        <div class="tab-menu">
            <button type="button" id="loginTab">로그인</button>
            <button type="button" id="signupTab">회원가입</button>
        </div>

        <!-- 로그인 화면 -->
        <form id="loginForm">
            <h2>로그인</h2>

            <label for="loginEmail">이메일</label>
            <input type="email" id="loginEmail"
                   placeholder="이메일을 입력하세요" required>

            <label for="loginPassword">비밀번호</label>
            <input type="password" id="loginPassword"
                   placeholder="비밀번호를 입력하세요" required>

            <button type="submit">로그인</button>
        </form>

        <!-- 회원가입 화면 -->
        <form id="signupForm" hidden>
            <h2>회원가입</h2>

            <label for="signupEmail">이메일</label>
            <input type="email" id="signupEmail" required>

            <label for="signupNickname">닉네임</label>
            <input type="text" id="signupNickname"
                   minlength="2" maxlength="8" required>

            <label for="signupPassword">비밀번호</label>
            <input type="password" id="signupPassword"
                   minlength="8" maxlength="20" required>

            <label for="confirmPassword">비밀번호 확인</label>
            <input type="password" id="confirmPassword" required>

            <button type="submit">회원가입</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>
    </div>
</body>
</html>
